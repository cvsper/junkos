# Umuve Desk — the ring-first ops app.
#
# One job: when a customer calls the desk line, the phone in a pocket rings
# like a real phone call, with the caller's name on it, and the person who
# answers can quote and book from the screen they're already on.
#
# Generated with `xcodegen generate` (same as Umuve Pro). Do not edit the
# .xcodeproj by hand.
name: UmuveDesk
options:
  bundleIdPrefix: com.goumuve
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 3
    TARGETED_DEVICE_FAMILY: "1"

packages:
  TwilioVoice:
    url: https://github.com/twilio/twilio-voice-ios
    from: "6.13.7"

targets:
  UmuveDesk:
    type: application
    platform: iOS
    sources:
      - path: Sources
    # A real Info.plist, generated from these properties. The INFOPLIST_KEY_*
    # route silently dropped UIBackgroundModes, which cost the app its VoIP
    # push token — and without that token there is nothing to ring.
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Umuve Desk
        CFBundleName: Umuve Desk
        CFBundleIconName: AppIcon
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSMicrophoneUsageDescription: "Umuve Desk uses the microphone so you can talk to customers who call the desk line."
        # voip: PushKit wakes the app for an incoming call while locked.
        # audio: the call keeps going when the screen turns off.
        UIBackgroundModes: [voip, audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goumuve.desk
        DEVELOPMENT_TEAM: 24GH82AX9R
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: UmuveDesk.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: TwilioVoice
        product: TwilioVoice
  UmuveDeskTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: UmuveDesk

schemes:
  Umuve Desk:
    build:
      targets:
        UmuveDesk: all
    test:
      targets:
        - UmuveDeskTests
