name: JunkOS-Driver
options:
  bundleIdPrefix: com.goumuve
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 36

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.1.1"
  MapboxNavigation:
    url: https://github.com/mapbox/mapbox-navigation-ios.git
    from: "3.18.2"

targets:
  JunkOS-Driver:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - Tests
          - "*.xcodeproj"
          - "*.xcworkspace"
          - DerivedData
          - build
          # Vendored SPM checkouts: ship their own example apps with
          # Main/LaunchScreen storyboards. Without this exclude, `path: .`
          # sweeps them into the app target → "Multiple commands produce
          # conflicting outputs" (LaunchScreen.storyboardc / Main.storyboardc).
          - .spm-cache
          - .build
          - .swiftpm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goumuve.pro
        DEVELOPMENT_TEAM: 24GH82AX9R
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: JunkOS-Driver.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_GENERATION_MODE: GeneratedFile
        # Force Xcode to GENERATE the Info.plist from the INFOPLIST_KEY_* values
        # below. Without this empty override, xcodegen's `path: .` scan auto-picks
        # a stray Info.plist from .spm-cache/artifacts (a Mapbox *simulator*
        # framework plist) → app stamped iphonesimulator → "Generic Xcode Archive"
        # → Distribute disabled. Empty + GENERATE_INFOPLIST_FILE = correct plist.
        INFOPLIST_FILE: ""
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Umuve Pro"
        INFOPLIST_KEY_CFBundleName: "Umuve Pro"
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_MBXAccessToken: $(MAPBOX_PUBLIC_ACCESS_TOKEN)
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Umuve Pro needs your location to show you nearby jobs and share your position with customers."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Umuve Pro needs continuous location access to track your position during active jobs."
        INFOPLIST_KEY_NSCameraUsageDescription: "Umuve Pro needs camera access to take before and after photos of job sites."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Umuve Pro needs photo library access to upload job site photos."
        INFOPLIST_KEY_UIBackgroundModes: "location"
    dependencies:
      - package: SocketIO
        product: SocketIO
      - package: MapboxNavigation
        product: MapboxNavigationCore
      - package: MapboxNavigation
        product: MapboxNavigationUIKit
      - package: MapboxNavigation
        product: MapboxMaps
  JunkOS-DriverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: JunkOS-Driver

schemes:
  Umuve Pro:
    build:
      targets:
        JunkOS-Driver: all
    test:
      targets:
        - JunkOS-DriverTests
