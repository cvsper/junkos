<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://elu.dev/v1/elu_pk_live_Qkuq7zxzjj0bVbaxzcZObMoiA4.js"></script>
    <title>Pay — Umuve</title>
    <link rel="icon" type="image/png" href="/logo-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: #f9fafb;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #DC2626, #B91C1C);
            padding: 2rem 2rem 1.5rem;
            text-align: center;
            color: white;
        }
        .header img { height: 28px; margin-bottom: 1rem; filter: brightness(10); }
        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
        }
        .header p { opacity: 0.9; font-size: 0.9rem; }
        .body { padding: 2rem; }
        .amount-display {
            text-align: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 1.5rem;
        }
        .amount-display .label { font-size: 0.8rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
        .amount-display .amount {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            color: #DC2626;
            margin: 0.25rem 0;
        }
        .amount-display .desc { font-size: 0.95rem; color: #374151; font-weight: 500; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 0.375rem; }
        .form-group input {
            width: 100%; padding: 0.75rem 1rem;
            border: 1.5px solid #d1d5db; border-radius: 0.5rem;
            font-size: 1rem; font-family: inherit;
            outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #DC2626; }
        .pay-btn {
            width: 100%; padding: 1rem;
            background: #DC2626; color: white;
            font-size: 1.1rem; font-weight: 700;
            border: none; border-radius: 0.5rem;
            cursor: pointer; transition: background 0.2s;
            font-family: inherit; margin-top: 0.5rem;
        }
        .pay-btn:hover { background: #B91C1C; }
        .pay-btn:disabled { background: #9ca3af; cursor: not-allowed; }
        .secure {
            display: flex; align-items: center; justify-content: center;
            gap: 0.375rem; margin-top: 1rem;
            font-size: 0.75rem; color: #9ca3af;
        }
        .error { color: #DC2626; font-size: 0.85rem; text-align: center; margin-top: 0.75rem; display: none; }
        .trust-row {
            display: flex; justify-content: center; gap: 1.5rem;
            padding: 1rem 2rem 1.5rem; border-top: 1px solid #f3f4f6;
            font-size: 0.75rem; color: #9ca3af;
        }
        .trust-row span { display: flex; align-items: center; gap: 0.25rem; }
        /* Admin input for amount (hidden when pre-filled) */
        .admin-fields { border: 2px dashed #e5e7eb; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; }
        .admin-fields .tag { font-size: 0.7rem; background: #f3f4f6; color: #6b7280; padding: 0.125rem 0.5rem; border-radius: 1rem; display: inline-block; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <img src="/logo-nav.png" alt="Umuve">
            <h1>Payment</h1>
            <p>Hauling made simple.</p>
        </div>
        <div class="body">
            <div class="amount-display">
                <div class="label">Amount Due</div>
                <div class="amount" id="amount-text">$0.00</div>
                <div class="desc" id="desc-text">Junk Removal Service</div>
            </div>

            <!-- Admin fields (shown when no amount in URL) -->
            <div id="admin-fields" class="admin-fields" style="display:none;">
                <span class="tag">Set payment details</span>
                <div class="form-group">
                    <label>Amount ($)</label>
                    <input type="number" id="admin-amount" min="1" step="0.01" placeholder="150.00">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="admin-desc" placeholder="Furniture Removal">
                </div>
            </div>

            <div class="form-group">
                <label>Email (for receipt)</label>
                <input type="email" id="email" placeholder="customer@email.com">
            </div>

            <button class="pay-btn" id="pay-btn" onclick="handlePay()">
                Pay Now
            </button>
            <div class="error" id="error-msg"></div>

            <div class="secure">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Secured by Stripe
            </div>
        </div>
        <div class="trust-row">
            <span>&#10003; Licensed &amp; Insured</span>
            <span>&#10003; Satisfaction Guaranteed</span>
        </div>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var amount = parseFloat(params.get('amount')) || 0;
        var desc = params.get('job') || params.get('desc') || 'Junk Removal Service';

        if (amount > 0) {
            document.getElementById('amount-text').textContent = '$' + amount.toFixed(2);
            document.getElementById('desc-text').textContent = desc;
        } else {
            // No amount — show admin fields for operator to fill in
            document.getElementById('admin-fields').style.display = 'block';
            document.getElementById('amount-text').textContent = '$—';
            document.getElementById('admin-amount').addEventListener('input', function() {
                var v = parseFloat(this.value) || 0;
                document.getElementById('amount-text').textContent = v > 0 ? '$' + v.toFixed(2) : '$—';
            });
            document.getElementById('admin-desc').addEventListener('input', function() {
                document.getElementById('desc-text').textContent = this.value || 'Junk Removal Service';
            });
        }

        function handlePay() {
            var btn = document.getElementById('pay-btn');
            var errEl = document.getElementById('error-msg');
            errEl.style.display = 'none';

            var payAmount = amount || parseFloat(document.getElementById('admin-amount').value) || 0;
            var payDesc = (amount > 0) ? desc : (document.getElementById('admin-desc').value || 'Junk Removal Service');
            var email = document.getElementById('email').value.trim();

            if (payAmount < 1) {
                errEl.textContent = 'Please enter a valid amount.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Processing...';

            fetch('https://junkos-backend.onrender.com/api/payments/quick-checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    amount: payAmount,
                    description: payDesc,
                    email: email || undefined
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.checkout_url) {
                    window.location.href = data.checkout_url;
                } else {
                    throw new Error(data.error || 'Payment failed');
                }
            })
            .catch(function(err) {
                errEl.textContent = err.message || 'Something went wrong. Please try again.';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Pay Now';
            });
        }
    </script>
</body>
</html>
