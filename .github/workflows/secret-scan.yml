# =============================================================================
# Secret scan — BLOCKING
# =============================================================================
# This repository is PUBLIC. A committed credential is live the moment it is
# pushed (audit finding F04: a Postgres connection string sat in
# backend/delete_via_sql.py). This workflow is the gate that stops the next one.
#
# It FAILS the workflow on any finding — there is no continue-on-error here.
# The nonblocking best-effort scans still live in security-scan.yml; this file
# is deliberately small, fast and mandatory so it can be a required status check.
#
# Two passes, both blocking:
#   1. working tree — catches a secret that is present in the checked-out code
#      right now, whichever commit introduced it.
#   2. commit range — catches a secret that was added and then removed in a
#      later commit of the same push/PR.
#
# NOTE ON HISTORY: git history still contains the F04 credential (it is being
# rotated rather than rewritten, so incident evidence survives). That is why
# pass 1 scans the tree with --no-git and pass 2 scans only this event's
# commits: a full-history scan would fail every run on an already-handled,
# already-rotated finding and the gate would get switched off. Re-enable a
# full-history scan after history is purged.
#
# Allowlist for known placeholders: .gitleaks.toml (repo root).
# =============================================================================

name: Secret Scan

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (blocking)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the commit-range scan can resolve the base commit.
          fetch-depth: 0

      # ---- Pass 1: the working tree -------------------------------------
      # Pinned tag, not :latest — a silent CLI change upstream must not be able
      # to turn this gate into a no-op or a spurious failure.
      - name: Scan working tree
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect \
              --no-git \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --redact \
              --verbose \
              --no-banner \
              --exit-code 1 \
              --report-format sarif \
              --report-path /repo/gitleaks-tree.sarif

      # ---- Pass 2: the commits in this push / PR ------------------------
      - name: Resolve commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # First push to a new branch reports an all-zero base.
            if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
              BASE="$(git rev-parse "$HEAD~1" 2>/dev/null || echo "$HEAD")"
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "Scanning $BASE..$HEAD"

      - name: Scan commit range
        if: steps.range.outputs.base != steps.range.outputs.head
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect \
              --source=/repo \
              --config=/repo/.gitleaks.toml \
              --log-opts="${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}" \
              --redact \
              --verbose \
              --no-banner \
              --exit-code 1

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks-tree.sarif
          retention-days: 30
        continue-on-error: true

      - name: What to do when this fails
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 🔴 A secret was detected

          **Removing the line is not enough — the value is compromised.**

          1. **Rotate it first.** Revoke the credential at the provider and issue a new one.
          2. Move the value to the host's environment (Render Environment tab /
             GitHub Secrets) and read it with `os.environ[...]` — no fallback literal.
          3. Push the fix. The value stays in git history until history is purged,
             which is why rotation comes first.
          4. If the finding is a genuine placeholder, add a narrow regex to
             `.gitleaks.toml` — and say so in the PR description.
          EOF
          exit 1
