services:
  - type: web
    name: umuve-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --worker-class eventlet --workers 1 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: umuve-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: umuve-redis
          property: connectionString
      - key: ENABLE_SCHEDULER
        value: "true"
      # Marketplace dispatch mode. "assign" = single best-hauler auto-assign;
      # "broadcast" = offer to every eligible hauler, first-to-accept.
      # HELD AT "assign": the native driver app cannot yet claim broadcast
      # JobOffers (offer-accept API/UI not shipped — see task #26), so in
      # broadcast mode an app-only hauler (e.g. the Palm Beach launch hauler)
      # can't accept jobs except via the SMS /o/<token> link. Flip to
      # "broadcast" only after the app ships offer support.
      - key: DISPATCH_MODE
        value: "assign"

  # Portal v1 scheduled tasks (spec 04 §9):
  #   * portal.recurring_tick   — every 5 min, generates Jobs for due schedules
  #   * portal.invoice_monthly  — 02:00 UTC on the 1st, invoices prior month
  # Worker + Beat run in one process (sufficient at MVP volume).
  - type: worker
    name: umuve-portal-beat
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A celery_app.celery worker -B --loglevel=info --concurrency=1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: umuve-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: umuve-redis
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: redis
    name: umuve-redis
    ipAllowList: []
    plan: starter

databases:
  - name: umuve-db
    databaseName: umuve
    user: umuve
