services:
  - type: web
    name: umuve-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --worker-class eventlet --workers 1 --timeout 120
    # /api/ready (not /api/health): health is liveness and answers 200
    # for a worker that booted with an unmigrated schema or no Stripe
    # key. Readiness fails the deploy instead of promoting it (F26).
    healthCheckPath: /api/ready
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: umuve-db
          property: connectionString
      # REDIS_URL intentionally removed 2026-06-19. The Celery worker that
      # needed a Redis broker was folded into the web's APScheduler (see
      # scheduler.py). The remaining Redis users — Flask-Limiter (extensions.py)
      # and ops_event_bus — fall back to memory:// / inline when REDIS_URL is
      # unset, so no Redis instance is required. Re-add only if you reintroduce
      # a separate worker or need cross-process rate limiting.
      - key: ENABLE_SCHEDULER
        value: "true"
      # Marketplace dispatch mode. "assign" = single best-hauler auto-assign;
      # "broadcast" = offer to every eligible hauler, first-to-accept.
      # HELD AT "assign": the native driver app cannot yet claim broadcast
      # JobOffers (offer-accept API/UI not shipped — see task #26), so in
      # broadcast mode an app-only hauler (e.g. the Palm Beach launch hauler)
      # can't accept jobs except via the SMS /o/<token> link. Flip to
      # "broadcast" only after the app ships offer support.
      - key: DISPATCH_MODE
        value: "assign"

  # ---------------------------------------------------------------------------
  # STAGING (added 2026-09-09): same code, deploys from the `staging` branch,
  # own database, own desk number — so Call Desk changes are exercised before
  # they reach Tracy. One-time: Render → Blueprints → sync this repo. Then
  # `git push origin main:staging` deploys here; merging to main still deploys
  # production. Buy the staging desk number with
  #   scripts/desk_line_setup.py --friendly "Umuve Call Desk STAGING"
  # and set the printed env here (sync: false keys are set by hand).
  - type: web
    name: umuve-backend-staging
    env: python
    rootDir: backend
    branch: staging
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --worker-class eventlet --workers 1 --timeout 120
    # /api/ready (not /api/health): health is liveness and answers 200
    # for a worker that booted with an unmigrated schema or no Stripe
    # key. Readiness fails the deploy instead of promoting it (F26).
    healthCheckPath: /api/ready
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: umuve-staging-db
          property: connectionString
      - key: BACKEND_URL
        value: https://umuve-backend-staging.onrender.com
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: DISPATCH_MODE
        value: "assign"
      - key: FEATURE_PASSCODE_LOGIN
        value: "on"
      - key: TRIXIE_ASSISTANT_PASSCODE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: DESK_TWILIO_NUMBER
        sync: false
      - key: TWILIO_TWIML_APP_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  # Portal v1 scheduled tasks (spec 04 §9) — recurring_tick + invoice_monthly,
  # plus the customer drip / Vapi review + reminder calls — were MIGRATED off
  # this Celery worker into the web's APScheduler on 2026-06-19 (see
  # scheduler.py). The `umuve-portal-beat` worker and `umuve-redis` instance
  # are therefore deleted to cut cost. celery_app.py is retained for manual
  # CLI backfills (e.g. invoice a specific month) but is no longer deployed.

databases:
  - name: umuve-db
    databaseName: umuve
    user: umuve
  - name: umuve-staging-db
    databaseName: umuve_staging
    user: umuve
    plan: basic-256mb
